<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 330" role="img" aria-label="The model reads the document, plain code checks it, then it either goes through or goes to a person" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0E0E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="330" fill="#fff"/><rect x="30" y="130" width="150" height="100" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="105" y="175" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">Document</text><text x="105" y="200" font-size="12" font-weight="400" fill="#5B5C63" text-anchor="middle">invoice, form, contract</text><line x1="184" y1="180" x2="236" y2="180" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><rect x="240" y="120" width="210" height="120" rx="16" fill="#DCE3FF"/><text x="345" y="170" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">The model reads</text><text x="345" y="196" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">fields + confidence</text><text x="345" y="262" font-size="12" font-weight="400" fill="#5B5C63" text-anchor="middle">Its only job: say what is written</text><line x1="454" y1="180" x2="506" y2="180" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><rect x="510" y="120" width="210" height="120" rx="16" fill="#0E0E10"/><text x="615" y="170" font-size="17" font-weight="600" fill="#fff" text-anchor="middle">Checks in plain code</text><text x="615" y="196" font-size="13" font-weight="400" fill="#C9CAD0" text-anchor="middle">totals add up, IDs exist,</text><text x="615" y="214" font-size="13" font-weight="400" fill="#C9CAD0" text-anchor="middle">no duplicate</text><text x="615" y="262" font-size="12" font-weight="400" fill="#5B5C63" text-anchor="middle">Decides whether it is safe to act</text><line x1="724" y1="160" x2="776" y2="110" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><line x1="724" y1="200" x2="776" y2="250" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><rect x="780" y="70" width="150" height="80" rx="16" fill="#fff" stroke="#3B5BFF" stroke-width="1.5"/><text x="855" y="106" font-size="16" font-weight="600" fill="#0E0E10" text-anchor="middle">Goes through</text><text x="855" y="128" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">on its own</text><rect x="780" y="210" width="150" height="80" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="855" y="246" font-size="16" font-weight="600" fill="#0E0E10" text-anchor="middle">Goes to a person</text><text x="855" y="268" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">with the reason</text></svg>