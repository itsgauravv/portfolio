<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 390" role="img" aria-label="Five questions to ask before an AI system runs without a human" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0E0E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="390" fill="#fff"/><rect x="30" y="24" width="900" height="58" rx="14" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><circle cx="68" cy="53" r="15" fill="#0E0E10"/><text x="68" y="58" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">1</text><text x="100" y="59" font-size="17" font-weight="500" fill="#0E0E10" text-anchor="start">What if the same input arrives twice?</text><rect x="770" y="37" width="140" height="32" rx="16" fill="#DCE3FF"/><text x="840" y="58" font-size="13" font-weight="600" fill="#3B5BFF" text-anchor="middle">Duplicates</text><rect x="30" y="96" width="900" height="58" rx="14" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><circle cx="68" cy="125" r="15" fill="#0E0E10"/><text x="68" y="130" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">2</text><text x="100" y="131" font-size="17" font-weight="500" fill="#0E0E10" text-anchor="start">Can I see what the AI changed?</text><rect x="770" y="109" width="140" height="32" rx="16" fill="#DCE3FF"/><text x="840" y="130" font-size="13" font-weight="600" fill="#3B5BFF" text-anchor="middle">Audit trail</text><rect x="30" y="168" width="900" height="58" rx="14" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><circle cx="68" cy="197" r="15" fill="#0E0E10"/><text x="68" y="202" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">3</text><text x="100" y="203" font-size="17" font-weight="500" fill="#0E0E10" text-anchor="start">What does it do when it is unsure?</text><rect x="770" y="181" width="140" height="32" rx="16" fill="#DCE3FF"/><text x="840" y="202" font-size="13" font-weight="600" fill="#3B5BFF" text-anchor="middle">Uncertainty</text><rect x="30" y="240" width="900" height="58" rx="14" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><circle cx="68" cy="269" r="15" fill="#0E0E10"/><text x="68" y="274" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">4</text><text x="100" y="275" font-size="17" font-weight="500" fill="#0E0E10" text-anchor="start">Can I change its instructions safely?</text><rect x="770" y="253" width="140" height="32" rx="16" fill="#DCE3FF"/><text x="840" y="274" font-size="13" font-weight="600" fill="#3B5BFF" text-anchor="middle">Versioning</text><rect x="30" y="312" width="900" height="58" rx="14" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><circle cx="68" cy="341" r="15" fill="#0E0E10"/><text x="68" y="346" font-size="14" font-weight="600" fill="#fff" text-anchor="middle">5</text><text x="100" y="347" font-size="17" font-weight="500" fill="#0E0E10" text-anchor="start">How do I turn it off?</text><rect x="770" y="325" width="140" height="32" rx="16" fill="#DCE3FF"/><text x="840" y="346" font-size="13" font-weight="600" fill="#3B5BFF" text-anchor="middle">Off switch</text></svg>