<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 960 370" role="img" aria-label="The engineer sits between the customer and the code, and works in four steps: listen, design, build, stay" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif"><defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#0E0E10" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs><rect width="960" height="370" fill="#fff"/><rect x="40" y="60" width="200" height="90" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="140" y="100" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">The customer</text><text x="140" y="124" font-size="12" font-weight="400" fill="#5B5C63" text-anchor="middle">real work, real people</text><rect x="380" y="50" width="200" height="110" rx="16" fill="#0E0E10"/><text x="480" y="98" font-size="20" font-weight="600" fill="#fff" text-anchor="middle">Me</text><text x="480" y="124" font-size="13" font-weight="400" fill="#C9CAD0" text-anchor="middle">in the middle</text><rect x="720" y="60" width="200" height="90" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="820" y="100" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">The code</text><text x="820" y="124" font-size="12" font-weight="400" fill="#5B5C63" text-anchor="middle">what actually ships</text><line x1="244" y1="95" x2="376" y2="95" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><line x1="376" y1="118" x2="244" y2="118" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><line x1="584" y1="95" x2="716" y2="95" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><line x1="716" y1="118" x2="584" y2="118" stroke="#0E0E10" stroke-width="1.6" marker-end="url(#ah)"/><rect x="40" y="210" width="205" height="120" rx="16" fill="#DCE3FF"/><text x="142" y="248" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">Listen</text><text x="142" y="278" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">Watch how the work</text><text x="142" y="298" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">really happens</text><rect x="265" y="210" width="205" height="120" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="367" y="248" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">Design</text><text x="367" y="278" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">Shape the screen</text><text x="367" y="298" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">and the flow</text><rect x="490" y="210" width="205" height="120" rx="16" fill="#DCE3FF"/><text x="592" y="248" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">Build</text><text x="592" y="278" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">Backend, integrations,</text><text x="592" y="298" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">prompts</text><rect x="715" y="210" width="205" height="120" rx="16" fill="#fff" stroke="#E4E5EA" stroke-width="1.5"/><text x="817" y="248" font-size="17" font-weight="600" fill="#0E0E10" text-anchor="middle">Stay</text><text x="817" y="278" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">Support it after</text><text x="817" y="298" font-size="13" font-weight="400" fill="#5B5C63" text-anchor="middle">launch</text></svg>